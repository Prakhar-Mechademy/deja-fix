<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Déjà Fix</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --mute:#6b7685; --brand:#3b5bdb; --hub:#2b8a3e; --llm:#e67700; --line:#e3e6eb; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  main { max-width:760px; margin:0 auto; padding:16px; }
  input, button { font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  button { background:var(--brand); color:#fff; border-color:var(--brand); cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:#fff; color:var(--brand); }
  #log { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; min-height:320px; max-height:60vh; overflow:auto; }
  .msg { margin:10px 0; max-width:88%; white-space:pre-wrap; padding:9px 12px; border-radius:12px; }
  .user { margin-left:auto; background:var(--brand); color:#fff; }
  .assistant { background:#eef1f6; }
  .tag { display:block; font-size:11px; margin-top:4px; color:var(--mute); }
  .hub .tag { color:var(--hub); } .llm .tag { color:var(--llm); }
  form { display:flex; gap:8px; margin-top:12px; } form input { flex:1; }
  #sessions { font-size:13px; color:var(--mute); margin-top:12px; }
  #sessions a { color:var(--brand); cursor:pointer; margin-right:12px; }
  .err { color:#c92a2a; font-size:13px; margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>Déjà Fix</h1>
  <input id="name" placeholder="Your name">
  <button id="join">Sign in</button>
  <button id="new" class="ghost" disabled>New session</button>
  <button id="close" class="ghost" disabled>End session</button>
  <span id="who" style="color:var(--mute)"></span>
</header>
<main>
  <div id="log"></div>
  <form id="f"><input id="text" placeholder="Describe your problem…" autocomplete="off" disabled><button disabled id="send">Send</button></form>
  <div class="err" id="err"></div>
  <div id="sessions"></div>
</main>
<script>
let user = JSON.parse(localStorage.getItem("dejafix_user") || "null"), sid = null;
const $ = id => document.getElementById(id);
const api = async (path, opts = {}) => {
  const r = await fetch(path, { ...opts, headers: { "Content-Type": "application/json", "X-User-Id": user ? user.user_id : "", ...(opts.headers || {}) } });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Request failed (" + r.status + ")");
  return j;
};
function add(role, content, source) {
  const d = document.createElement("div");
  d.className = "msg " + role + " " + (source || "");
  d.textContent = content;
  if (role === "assistant" && (source === "hub" || source === "llm")) {
    const t = document.createElement("span"); t.className = "tag";
    t.textContent = source === "hub" ? "verified fix from the knowledge hub" : "suggested by backend assistant, not yet verified";
    d.appendChild(t);
  }
  $("log").appendChild(d); $("log").scrollTop = 1e9;
}
function ui() {
  $("who").textContent = user ? "Signed in as " + user.display_name : "";
  $("new").disabled = !user; $("close").disabled = !sid;
  $("text").disabled = $("send").disabled = !sid;
}
const err = m => { $("err").textContent = m || ""; };
async function listSessions() {
  if (!user) return;
  const rows = await api("/sessions");
  $("sessions").innerHTML = "Your sessions: ";
  rows.forEach((s, i) => { const a = document.createElement("a"); a.textContent = "#" + (i + 1) + " (" + s.state + ")"; a.onclick = () => openSession(s.session_id); $("sessions").appendChild(a); });
}
async function openSession(id) {
  const s = await api("/sessions/" + id); sid = id; $("log").innerHTML = "";
  s.messages.forEach(m => add(m.role, m.content, m.source)); ui(); err();
}
async function newSession() {
  const s = await api("/sessions", { method: "POST" }); sid = s.session_id; $("log").innerHTML = "";
  add("assistant", s.greeting, "persona"); ui(); listSessions();
}
$("join").onclick = async () => {
  try {
    const n = $("name").value.trim(); if (!n) return;
    user = await api("/users", { method: "POST", body: JSON.stringify({ display_name: n }) });
    localStorage.setItem("dejafix_user", JSON.stringify(user)); await newSession();
  } catch (e) { err(e.message); }
};
$("new").onclick = () => newSession().catch(e => err(e.message));
$("close").onclick = async () => { try { await api("/sessions/" + sid + "/close", { method: "POST" }); sid = null; ui(); listSessions(); } catch (e) { err(e.message); } };
$("f").onsubmit = async ev => {
  ev.preventDefault(); const t = $("text").value.trim(); if (!t || !sid) return;
  $("text").value = ""; add("user", t); err();
  try {
    const r = await api("/sessions/" + sid + "/messages", { method: "POST", body: JSON.stringify({ content: t }) });
    add("assistant", r.reply, r.source);
  } catch (e) { err(e.message); }
};
ui(); if (user) { $("who").textContent = "Signed in as " + user.display_name; listSessions().catch(() => {}); }
</script>
</body>
</html>
