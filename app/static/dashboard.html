<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Déjà Fix — Operations Dashboard</title>
<style>
:root{--bg:#0b1020;--panel:#121931;--panel2:#17203a;--line:#263152;--text:#edf2ff;--muted:#96a1bf;--brand:#7c91ff;--cyan:#50d4d3;--green:#54d69c;--amber:#ffc86a;--red:#ff7d94}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#090e1b,#11172a);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif}.shell{display:grid;grid-template-columns:220px 1fr;height:100vh}.sidebar{border-right:1px solid var(--line);padding:24px 16px;background:#0d1325}.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;margin-bottom:28px}.brandmark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--cyan));box-shadow:0 8px 28px #7c91ff44}.nav button{width:100%;border:0;color:var(--muted);background:transparent;padding:11px 12px;border-radius:9px;text-align:left;margin:3px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--panel2);color:white}.main{overflow:auto}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.status{font-size:12px;color:var(--green)}.content{padding:24px 28px 40px}.page{display:none}.page.active{display:block}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}.metric .label{color:var(--muted);font-size:12px}.metric .value{font-size:28px;font-weight:800;margin-top:8px}.metric .trend{font-size:11px;color:var(--cyan);margin-top:5px}.grid{display:grid;grid-template-columns:1.55fr 1fr;gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}.card h3{margin:0 0 14px;font-size:14px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th{text-align:left;color:var(--muted);font-size:11px;border-bottom:1px solid var(--line);padding:9px}.table td{border-bottom:1px solid #202946;padding:10px 9px}.pill{border-radius:999px;padding:4px 8px;font-size:11px;background:#263152}.pill.green{color:var(--green);background:#18382f}.pill.amber{color:var(--amber);background:#423520}.pill.red{color:var(--red);background:#402636}.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.input,select{background:#0c1224;color:white;border:1px solid var(--line);border-radius:9px;padding:10px 12px}.btn{border:0;border-radius:9px;background:var(--brand);color:white;padding:10px 14px;cursor:pointer;font-weight:700}.btn.secondary{background:var(--panel2);border:1px solid var(--line)}.chat-layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 120px)}.chat-sidebar{border-right:1px solid var(--line);padding:12px}.chat-sidebar .item{border:1px solid transparent;padding:10px;border-radius:9px;cursor:pointer;margin-bottom:6px}.chat-sidebar .item:hover,.chat-sidebar .item.active{background:var(--panel2);border-color:var(--line)}.chat-main{display:grid;grid-template-rows:auto 1fr auto}.chat-head{padding:12px 16px;border-bottom:1px solid var(--line)}.messages{overflow:auto;padding:18px}.bubble{max-width:72%;padding:11px 13px;border-radius:12px;margin:8px 0;white-space:pre-wrap}.bubble.user{margin-left:auto;background:#4e63bc}.bubble.assistant{background:var(--panel2)}.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1}.solution{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}.solution h4{margin:0 0 7px}.solution p{color:var(--muted);font-size:12px;margin:5px 0}.chart{height:180px;display:flex;align-items:flex-end;gap:8px;border-bottom:1px solid var(--line);padding:10px}.bar{flex:1;border-radius:6px 6px 0 0;background:linear-gradient(var(--brand),#4a55a5);min-width:8px}.bars-wrap{height:210px}.empty{text-align:center;color:var(--muted);padding:40px}@media(max-width:900px){.shell{grid-template-columns:1fr}.sidebar{display:none}.metrics{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.chat-layout{grid-template-columns:1fr}.chat-sidebar{display:none}}
</style>
</head>
<body><div class="shell"><aside class="sidebar"><div class="brand"><span class="brandmark">D</span>Déjà Fix</div><nav class="nav"><button class="active" data-page="overview">⌂ Overview</button><button data-page="chat">◫ Support Chat</button><button data-page="hub">◆ Knowledge Hub</button><button data-page="sessions">▤ Sessions</button><button data-page="usage">◴ Token Usage</button></nav></aside><main class="main"><header class="topbar"><b id="title">Overview</b><span class="status" id="health">● Checking API</span></header><div class="content"><section id="overview" class="page active"></section><section id="chat" class="page"><div class="chat-layout"><aside class="chat-sidebar"><div class="toolbar"><b>Sessions</b><button class="btn" id="newSession">+ New</button></div><div id="chatSessions"></div></aside><div class="chat-main"><div class="chat-head" id="chatHead">Select or create a session</div><div class="messages" id="messages"></div><form class="composer" id="composer"><input class="input" id="messageInput" placeholder="Ask about a support issue…"><button class="btn" type="submit">Send</button></form></div></div></section><section id="hub" class="page"></section><section id="sessions" class="page"></section><section id="usage" class="page"></section></div></main></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let currentUser=null,currentSession=null;
async function api(path,options){const r=await fetch(path,options);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail||d.error||`HTTP ${r.status}`);return d}
function pill(v){return `<span class="pill ${v==='active'?'green':v==='ended'?'':'amber'}">${v||'unknown'}</span>`}
function fmt(v){return v==null?'-':String(v)}
$$('.nav button').forEach(b=>b.onclick=()=>{$$('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');$$('.page').forEach(p=>p.classList.remove('active'));$('#'+b.dataset.page).classList.add('active');$('#title').textContent=b.textContent.replace(/^[^A-Z]+/,'');refresh()});
async function refresh(){await health();if($('#overview').classList.contains('active'))loadOverview();if($('#hub').classList.contains('active'))loadHub();if($('#sessions').classList.contains('active'))loadSessions();if($('#usage').classList.contains('active'))loadUsage();if($('#chat').classList.contains('active'))loadChatSessions()}
async function health(){try{await api('/health');$('#health').textContent='● API online'}catch{$('#health').textContent='● API offline'}}
async function loadOverview(){const [solutions,stats]=await Promise.all([api('/solutions'),api('/stats/tokens')]);const sessions=stats.sessions||[],hub=sessions.filter(s=>s.served_from_hub).length,escalated=sessions.filter(s=>s.escalation_calls>0).length,total=sessions.reduce((n,s)=>n+s.total_tokens,0);$('#overview').innerHTML=`<div class="metrics"><div class="metric"><div class="label">Solutions in hub</div><div class="value">${solutions.length}</div><div class="trend">Verified fixes only</div></div><div class="metric"><div class="label">Sessions</div><div class="value">${sessions.length}</div><div class="trend">${hub} served from hub</div></div><div class="metric"><div class="label">Escalations</div><div class="value">${escalated}</div><div class="trend">Backend LLM calls</div></div><div class="metric"><div class="label">Tokens used</div><div class="value">${total.toLocaleString()}</div><div class="trend">All LLM activity</div></div></div><div class="grid"><div class="card"><h3>Recent sessions</h3><table class="table"><thead><tr><th>ID</th><th>User</th><th>Mode</th><th>Type</th><th>Tokens</th></tr></thead><tbody>${sessions.slice().reverse().slice(0,8).map(s=>`<tr><td>#${s.session_id}</td><td>${s.user_id}</td><td>${pill(s.mode)}</td><td>${s.served_from_hub?'Hub':'Escalated'}</td><td>${s.total_tokens}</td></tr>`).join('')||'<tr><td colspan="5" class="empty">No sessions yet</td></tr>'}</tbody></table></div><div class="card"><h3>Knowledge hub</h3>${solutions.slice(0,6).map(s=>`<div class="solution"><h4>${escapeHtml(s.title)}</h4><p>${escapeHtml((s.symptoms||[]).join(', ')||'No symptoms')}</p><p>${s.use_count||1} confirmed source(s)</p></div>`).join('')||'<div class="empty">The hub is empty</div>'}</div></div>`}
async function loadHub(){const sols=await api('/solutions');$('#hub').innerHTML=`<div class="toolbar"><div><h2 style="margin:0">Knowledge Hub</h2><small style="color:var(--muted)">${sols.length} confirmed solutions</small></div></div><div class="grid" style="grid-template-columns:1fr 1fr">${sols.map(s=>`<div class="solution"><div style="display:flex;justify-content:space-between"><h4>${escapeHtml(s.title)}</h4><span class="pill green">×${s.use_count||1}</span></div><p><b>Symptoms</b>: ${escapeHtml((s.symptoms||[]).join('; ')||'—')}</p><p><b>Environment</b>: ${escapeHtml(JSON.stringify(s.environment||{}))}</p><p><b>Fix</b>: ${escapeHtml((s.fix_steps||[]).join(' → ')||'—')}</p><p><b>Skip</b>: ${escapeHtml((s.failed_attempts||[]).join(', ')||'—')}</p><p>Sources: ${(s.source_session_ids||[]).map(id=>'#'+id).join(', ')||'—'}</p></div>`).join('')||'<div class="card empty">No confirmed solutions yet. End a successful support session to add one.</div>'}</div>`}
async function loadSessions(){const users=await getKnownUsers();let all=[];for(const u of users){try{all=all.concat(await api('/users/'+u+'/sessions'))}catch{}}$('#sessions').innerHTML=`<div class="toolbar"><h2 style="margin:0">Sessions</h2></div><div class="card"><table class="table"><thead><tr><th>ID</th><th>Status</th><th>Mode</th><th>Topic</th><th>Messages</th><th>Started</th></tr></thead><tbody>${all.sort((a,b)=>String(b.started_at).localeCompare(String(a.started_at))).map(s=>`<tr><td>#${s.id}</td><td>${pill(s.status)}</td><td>${pill(s.mode)}</td><td>${escapeHtml(s.topic_summary||'—')}</td><td>${s.message_count}</td><td>${fmt(s.started_at).replace('T',' ').slice(0,16)}</td></tr>`).join('')||'<tr><td colspan="6" class="empty">No sessions yet</td></tr>'}</tbody></table></div>`}
async function loadUsage(){const d=await api('/stats/tokens');const rows=d.sessions||[];$('#usage').innerHTML=`<div class="metrics"><div class="metric"><div class="label">Hub average</div><div class="value">${d.summary.average_total_tokens_hub}</div></div><div class="metric"><div class="label">Escalated average</div><div class="value">${d.summary.average_total_tokens_escalated}</div></div></div><div class="grid"><div class="card"><h3>Tokens by session</h3><div class="bars-wrap"><div class="chart">${rows.map(s=>`<div title="Session ${s.session_id}: ${s.total_tokens}" class="bar" style="height:${Math.max(4,Math.min(170,s.total_tokens/Math.max(...rows.map(r=>r.total_tokens),1)*170))}px"></div>`).join('')}</div></div></div><div class="card"><h3>LLM calls</h3><table class="table"><thead><tr><th>Session</th><th>Type</th><th>In</th><th>Out</th><th>Total</th></tr></thead><tbody>${rows.map(s=>`<tr><td>#${s.session_id}</td><td>${s.escalation_calls?'Escalated':'Hub / none'}</td><td>${s.tokens_in}</td><td>${s.tokens_out}</td><td>${s.total_tokens}</td></tr>`).join('')}</tbody></table></div></div>`}
async function getKnownUsers(){const r=await fetch('/api/dashboard/overview');if(r.ok){const d=await r.json();return d.users||[]}const d=await api('/stats/tokens');return [...new Set(d.sessions.map(s=>s.user_id))]}
async function loadChatSessions(){if(!currentUser){const users=await getKnownUsers();if(users.length){currentUser=users[0]}else{await createDemoUser()}}const sessions=await api('/users/'+currentUser+'/sessions');$('#chatSessions').innerHTML=sessions.map(s=>`<div class="item ${currentSession&&currentSession.id===s.id?'active':''}" onclick="openChat(${s.id})"><b>#${s.id}</b> ${pill(s.status)}<br><small style="color:var(--muted)">${escapeHtml(s.topic_summary||s.mode)}</small></div>`).join('')||'<div class="empty">No sessions</div>'}
async function createDemoUser(){const name='Dashboard User '+Math.floor(100+Math.random()*900);const u=await api('/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});currentUser=u.id}
$('#newSession').onclick=async()=>{if(!currentUser)await createDemoUser();const d=await api('/sessions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUser})});currentSession=d.session;$('#chatHead').innerHTML=`Session #${d.session.id} · ${escapeHtml(d.greeting)}`;$('#messages').innerHTML=`<div class="bubble assistant">${escapeHtml(d.greeting)}</div>`;loadChatSessions()};
async function openChat(id){const d=await api('/sessions/'+id+'?user_id='+currentUser);currentSession=d.session;$('#chatHead').innerHTML=`Session #${id} · ${d.session.mode}`;$('#messages').innerHTML=d.messages.map(m=>`<div class="bubble ${m.role==='user'?'user':'assistant'}">${escapeHtml(m.content)}</div>`).join('');$('#messages').scrollTop=$('#messages').scrollHeight}
$('#composer').onsubmit=async e=>{e.preventDefault();if(!currentSession){await $('#newSession').onclick();}const input=$('#messageInput'),text=input.value.trim();if(!text)return;input.value='';try{const r=await api('/sessions/'+currentSession.id+'/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_id:currentUser,content:text})});await openChat(currentSession.id);loadOverview()}catch(err){$('#messages').insertAdjacentHTML('beforeend',`<div class="bubble assistant">${escapeHtml(err.message)}</div>`)}};
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
refresh();setInterval(health,10000);setInterval(()=>{if($('.page.active'))refresh()},15000);
</script></body></html>
